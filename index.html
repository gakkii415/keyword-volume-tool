<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Google検索のキーワード検索ボリュームを地域・言語別に比較するツール">
  <meta name="theme-color" content="#f6f6f2">
  <title>検索ボリューム</title>
  <link rel="stylesheet" href="./styles.css?v=1">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>検索ボリューム</h1>
      <p class="topbar-note">Google検索の需要をキーワードごとに比較</p>
    </div>
    <button class="text-button" id="openSettings" type="button">接続設定</button>
  </header>

  <main class="page-shell">
    <section class="query-panel" aria-labelledby="queryTitle">
      <h2 class="sr-only" id="queryTitle">検索条件</h2>

      <label class="field-label" for="keywords">キーワード</label>
      <textarea id="keywords" rows="5" placeholder="例）&#10;京都 ネイル&#10;京都 タトゥー&#10;京都 ヘッドスパ" autocomplete="off" spellcheck="false"></textarea>
      <div class="field-help"><span id="keywordCount">0件</span><span>改行・カンマ区切り / 最大100件</span></div>

      <div class="filter-row">
        <div class="field-group location-group">
          <label class="field-label" for="locationInput">地域</label>
          <div class="location-input-wrap">
            <input id="locationInput" type="search" value="日本" placeholder="地域を検索" autocomplete="off">
            <span class="input-status" id="locationStatus" aria-live="polite"></span>
          </div>
          <div class="suggestions" id="locationSuggestions" role="listbox" hidden></div>
          <input id="locationResource" type="hidden" value="geoTargetConstants/2392">
        </div>

        <div class="field-group language-group">
          <label class="field-label" for="language">言語</label>
          <select id="language">
            <option value="languageConstants/1005" selected>日本語</option>
            <option value="languageConstants/1000">英語</option>
            <option value="">すべて</option>
          </select>
        </div>
      </div>

      <button class="primary-button" id="searchButton" type="button">検索する</button>
      <p class="connection-note" id="connectionNote" aria-live="polite"></p>
    </section>

    <section class="results-section" id="resultsSection" aria-labelledby="resultsTitle" hidden>
      <div class="results-header">
        <div>
          <h2 id="resultsTitle">結果</h2>
          <p id="resultsMeta"></p>
        </div>
        <div class="results-actions">
          <select id="sortResults" aria-label="並び順">
            <option value="volume-desc">月平均が多い順</option>
            <option value="input">入力順</option>
            <option value="volume-asc">月平均が少ない順</option>
          </select>
          <button class="secondary-button" id="exportCsv" type="button">CSV</button>
        </div>
      </div>

      <div class="status-block" id="resultsStatus" hidden></div>
      <div id="resultsList"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-card" id="settingsForm">
      <div class="dialog-header">
        <div>
          <h2>接続設定</h2>
          <p>この端末だけに保存されます。</p>
        </div>
        <button class="icon-button" value="cancel" type="submit" aria-label="閉じる">×</button>
      </div>

      <label class="field-label" for="backendUrl">API URL</label>
      <input id="backendUrl" type="url" inputmode="url" placeholder="https://xxxxx.vercel.app">

      <label class="field-label settings-spacer" for="accessToken">アクセスキー</label>
      <input id="accessToken" type="password" autocomplete="off" placeholder="Vercelの APP_ACCESS_TOKEN と同じ値">

      <div class="dialog-actions">
        <button class="secondary-button" id="testConnection" type="button">接続確認</button>
        <button class="primary-button dialog-save" id="saveSettings" value="default" type="submit">保存</button>
      </div>
      <p class="settings-status" id="settingsStatus" aria-live="polite"></p>
    </form>
  </dialog>

  <footer>
    <span>Google Ads API の概算値</span>
    <span>v1</span>
  </footer>

  <script src="./app.js?v=1" defer></script>
</body>
</html>
